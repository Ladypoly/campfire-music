# Campfire Radio: build the site (download, loudness-match, convert, covers, playlist.txt) and publish it on GitHub Pages.
# Runs when main changes, on the 1st of every month (the new month's playlist goes live) and by hand.
# Repo settings: Pages -> Source = "GitHub Actions".
name: Publish site
on:
  push:
    branches: [main]
  schedule:
    - cron: "7 0 1 * *"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          pip install -q pillow
      - name: Cache downloads + converted songs
        uses: actions/cache@v4
        with:
          path: .cache
          key: radio-${{ hashFiles('months/*.txt', 'own.txt', 'tracks/**') }}
          restore-keys: radio-
      - name: Build
        run: python scripts/build.py --out _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
